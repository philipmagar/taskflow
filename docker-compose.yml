

services:
  app:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=REMOVED
      - DB_NAME=taskflow_db
      - JWT_SECRET=REMOVED
      - JWT_EXPIRES_IN=1d
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-network

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=REMOVED
      - MYSQL_DATABASE=taskflow_db
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  db_data:
