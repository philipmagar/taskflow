global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    stats uri /haproxy?stats
    default_backend http_back

backend http_back
    balance roundrobin
    # This uses HAProxy's server-template to dynamically scale based on Docker DNS.
    # It prepares up to 10 backend slots resolving the hostname 'app'.
    server-template app 10 app:5000 check resolvers docker init-addr libc,none

resolvers docker
    # Docker's embedded DNS server
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s
